[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "android-app-graph"
version = "0.1.0"
description = "Android-App-Graph: explores Android apps into UI state-transition graphs, a fork of YuxiangChai/UI-KOBE by Yuxiang Chai"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# openrouter requires pydantic<2.13, whose pydantic-core cannot build on Python 3.15;
# lift this cap once an openrouter release allows pydantic>=2.14.
requires-python = ">=3.14,<3.15"
dependencies = [
    "networkx>=3.7",
    "pyyaml>=6.0.3",
    "pillow>=12.3.0",
    "rich>=15.0.0",
    "httpx>=0.28.1",
    "openrouter>=1.3.63",
]
authors = [
    { name = "Yuxiang Chai" },
]
maintainers = [
    { name = "John Park" },
]

[project.scripts]
app-graph = "android_app_graph.cli:main"
app-graph-audit = "android_app_graph.commands.audit:main"
app-graph-build = "android_app_graph.commands.build:main"
app-graph-plot = "android_app_graph.commands.plot:main"

[project.urls]
Homepage = "https://github.com/john-agi/Android-App-Graph"

[project.optional-dependencies]
viz = [
    "matplotlib>=3.10.8",
    "pyvis>=0.3.2",
]

[tool.uv]
required-version = ">=0.12.9,<0.13"

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "hypothesis>=6.167.1",
    # matplotlib and pyvis repeat the `viz` extra on purpose: uv has no documented way for a
    # dependency group to include the project's own extra and never syncs extras by default,
    # while ty (unresolved-import) and the app-graph-plot tests need both installed.
    "matplotlib>=3.10.8",
    "poethepoet>=0.48.0",
    "prek>=0.5.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "pyvis>=0.3.2",  # see the matplotlib comment above
    "ruff>=0.16.5",
    "tach>=0.35.0",
    "ty>=0.0.77",
    "vulture>=2.16",
    "zizmor>=1.30.0",
]
mutation = [
    "mutmut>=3.7.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# ty's migration guide asks for preview so PYI033 also checks .py files. Preview rules are
# NOT pulled in by the prefixes below, nor by the preview default set, because
# explicit-preview-rules requires exact codes.
preview = true
explicit-preview-rules = true
# extend-select adds to Ruff's default set; `select` would replace it.
extend-select = [
    "B",
    "C4",
    "SIM",
    "PERF",
    "UP",
    "PTH",
    "DTZ",
    "A",
    "ICN",
    "PLW",
    "PLR5501",
    "RET",
    "PIE",
    "FURB",
    "LOG",
    "G",
    "RSE",
    "FLY",
    "BLE",
    "T10",
    "EXE",
    "TID",
    "SLOT",
    "YTT",
    "PGH",
    "RUF",
    "ASYNC",
    "INT",
    "PLE",
    "I",
    "ANN",
    "PLR0913",
    "PLR0917",
    "PLR2004",
    "FBT",
    "PYI",
    "ARG",
    "ERA",
    "SLF",
    "PT",
    "S",
    "T20",
    "INP001",
    "N",
    "EM",
    "TRY",
    "C90",
    "PLR0911",
    "PLR0912",
    "PLR0915",
]
# FA100/FA102 can never fire at py314 (annotations are deferred by PEP 649/749), so
# they need no `ignore` entry.

[tool.ruff.lint.per-file-ignores]
# pytest checks results with plain `assert`. Pytest passes fixtures and parametrize values by
# name, so a test's parameters declare dependencies rather than a call signature (FBT001,
# FBT002, PLR0913, PLR0917), and a literal in a test is the value under test or the expected
# value (FBT003, PLR2004).
"tests/**" = ["S101", "FBT", "PLR0913", "PLR0917", "PLR2004"]
# Vulture allowlist entries are intentionally bare attribute expressions.
"vulture_allowlist.py" = ["B018"]

[tool.ruff.format]
docstring-code-format = true

[tool.deptry]
# Not inferable from the src/ layout; without it every `import android_app_graph` is DEP001.
known_first_party = ["android_app_graph"]

[tool.vulture]
# Positional paths on the command line REPLACE this list (verified with 2.16),
# so every Poe task repeats it, allowlist included.
paths = ["src", "tests", "vulture_allowlist.py"]
min_confidence = 90

[tool.ty.src]
# scripts/ and configs/ are operator scripts, not package code.
include = ["src", "tests"]

[tool.ty.rules]
# Stricter tier from ty's migration guide plus missing-override-decorator; all
# default to "ignore". division-by-zero, possibly-missing-attribute and
# possibly-missing-import stay off: the guide calls them false-positive-prone.
blanket-ignore-comment = "error"
dynamic-function-decorator-return = "error"
missing-override-decorator = "error"
missing-type-argument = "error"
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"
possibly-unresolved-reference = "warn"
unsupported-dynamic-base = "warn"

[tool.ty.analysis]
# `# ty: ignore[rule]  # reason` is the only suppression that works.
respect-type-ignore-comments = false
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.terminal]
# Default, stated on purpose: the two "warn" rules above are blocking too.
error-on-warning = true

[tool.pytest]
minversion = "9.0"
strict = true
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "-p", "no:tach"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["android_app_graph"]

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
precision = 2
# Ratchet: set from the measured baseline, only ever raised.
fail_under = 99.10

[tool.mutmut]
# scripts/ and configs/ are operator scripts, not package code.
source_paths = ["src/android_app_graph/"]
pytest_add_cli_args_test_selection = ["tests/"]
# Guards the clean stats run should --cov ever move into addopts, where
# fail_under would abort it.
pytest_add_cli_args = ["--no-cov"]

[tool.poe]
# `uv run` has already activated .venv; the default `auto` executor would nest a second
# `uv run` per task because uv.lock exists.
executor = "simple"

[tool.poe.tasks]
_fix-lint = "ruff check --fix --exit-zero ."
_format = "ruff format ."
_format-check = "ruff format --check ."
_lint = "ruff check ."
_typecheck = "ty check"
_dependencies = "deptry ."
_environment = "uv pip check"
_test = "pytest --cov=android_app_graph --cov-report=term-missing"
_actions = "zizmor --offline ."
_build = "uv build --no-sources"
_dead-code = "vulture src tests vulture_allowlist.py --min-confidence 90"
_architecture = "tach check"

[tool.poe.tasks.fix]
help = "Apply safe autofixes and format"
sequence = ["_fix-lint", "_format"]

[tool.poe.tasks.check-fast]
help = "Fast checks: format, lint, types"
sequence = ["_format-check", "_lint", "_typecheck", "_architecture"]

[tool.poe.tasks.test-unit]
help = "Run the test suite without coverage"
cmd = "pytest"

[tool.poe.tasks.check]
help = "Definition of done: every non-mutating check"
sequence = ["check-fast", "_dependencies", "_environment", "_dead-code", "_test", "_actions", "_build"]

[tool.poe.tasks.dead-code-review]
help = "Review queue: likely-dead code at 60% confidence, sorted by size, smallest first (largest last). Never deleted automatically."
cmd = "vulture src tests vulture_allowlist.py --min-confidence 60 --sort-by-size"

[tool.poe.tasks.mutate]
help = "Mutation testing of src/android_app_graph with tests/ (review queue, never a gate); state in mutants/"
cmd = "mutmut run"
# Derandomized, no example database: a mutant's survival cannot depend on which examples ran.
env = { HYPOTHESIS_PROFILE = "ci" }
