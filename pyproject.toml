[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[project]
name = "ui-kobe"
version = "0.1.0"
description = "Android-App-Graph: graph-based Android app exploration and runtime for mobile GUI agents, a fork of UI-KOBE by Yuxiang Chai"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
dependencies = [
    "networkx",
    "openai",
    "pyyaml",
    "pillow",
    "rich",
    "dill",
    "aitk",
    "httpx>=0.28.1",
]
authors = [
    { name = "Yuxiang Chai" },
]
maintainers = [
    { name = "John Park" },
]

[project.scripts]
kobe-explore = "ui_kobe.cli:main"

[project.urls]
Homepage = "https://github.com/john-agi/Android-App-Graph"

[project.optional-dependencies]
viz = [
    "matplotlib>=3.10.8",
    "pyvis>=0.3.2",
]

[tool.uv]
required-version = ">=0.12.9,<0.13"
exclude-newer = "3 days"

[tool.uv.sources]
aitk = { git = "https://github.com/YuxiangChai/AITK", rev = "fd06a28e2286cbc1ae699401c1a6f894ba926c44" }

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "hypothesis>=6.167.1",
    "poethepoet>=0.48.0",
    "prek>=0.5.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "ruff>=0.16.5",
    "ty>=0.0.77",
    "vulture>=2.16",
    "zizmor>=1.30.0",
]
mutation = [
    "mutmut>=3.7.0",
]

[tool.ruff]
# Minimum Python to target. The project is 3.14 only (requires-python = ">=3.14").
target-version = "py314"
# Wrap target for the formatter and isort; the roadmap fixed 100.
line-length = 100
# First-party roots for import sorting. tests/ does not exist yet; Ruff does not need it to.
src = ["src", "tests"]

[tool.ruff.lint]
# ty's migration guide asks for preview so PYI033 also checks .py files. Preview rules are
# NOT pulled in by the prefixes below, nor by the preview default set, because
# explicit-preview-rules requires exact codes.
preview = true
explicit-preview-rules = true
# extend-select ADDS to the active default set (413 rules without preview; with lint.preview = true
# Ruff 0.16.x activates a different default set of 494, see `ruff check --show-settings`).
# `select` would replace it.
extend-select = [
    "I",       # isort (I001 is already default; this adds I002)
    "ANN",     # flake8-annotations (ANN101/ANN102 no longer exist)
    "PYI",     # flake8-pyi (47 rules are default; adds the rest)
    "ARG",     # flake8-unused-arguments
    "ERA",     # eradicate: commented-out code
    "PT",      # flake8-pytest-style (tests arrive later)
    "T20",     # flake8-print: T201 print, T203 pprint
    "PLW0603", # Pylint: global statements
    "PGH003",  # pygrep-hooks blanket-type-ignore: `# type: ignore` without a code
    "PGH004",  # pygrep-hooks blanket-noqa: `# noqa` without a code
    "INP001",  # every directory under src/ must be a package (__init__.py)
]
# No `ignore` list, by policy. FA100/FA102 are default rules that can never fire at py314
# (annotations are deferred by PEP 649/749), so they need no ignore entry and no selection.

[tool.ruff.lint.per-file-ignores]
# This table is fixed by the roadmap. Operator scripts and copy-in adapters are not packages,
# and printing is their user interface.
"scripts/**" = ["T201", "T203", "INP001"]
"aitk_files/**" = ["T201", "T203", "INP001"]
"aw_files/**" = ["T201", "T203", "INP001"]
# Tests are not a package. S101 is listed now so `assert` stays allowed if S is ever enabled.
"tests/**" = ["INP001", "S101"]
# Vulture allowlist entries are intentionally bare attribute expressions.
"vulture_allowlist.py" = ["B018"]

[tool.ruff.lint.flake8-annotations]
# `**kwargs: Any` is the honest annotation for pass-through keyword arguments.
allow-star-arg-any = true

[tool.ruff.format]
# Also format doctest and fenced code examples inside docstrings.
docstring-code-format = true

[tool.deptry]
# Not inferable from the src/ layout; without it every `import ui_kobe` is DEP001.
known_first_party = ["ui_kobe"]

[tool.deptry.per_rule_ignores]
# aw_files/ui_kobe_aw_agent.py is a copy-in adapter; android_world is not declared here.
# It is not on PyPI and not installable on Python 3.14, so it cannot be declared (decision in #19).
DEP001 = ["android_world"]
# Nothing here imports dill; aitk/utils/adb_controller.py:9 does, and aitk declares no deps.
DEP002 = ["dill"]

# Vulture dead-code detection. Policy and the allowlist rule: see AGENTS.md.
[tool.vulture]
# https://github.com/jendrikseipp/vulture#configuration
# Positional paths on the command line REPLACE this list (verified with 2.16),
# so every Poe task repeats it, allowlist included.
paths = ["src", "tests", "vulture_allowlist.py"]
min_confidence = 90

# ty type checker. Rationale and the suppression rule: see AGENTS.md.
[tool.ty.src]
# The root adapters and operator scripts are linted by Ruff, not type-checked.
# They are copy-in files, not package code; aw_files/ imports android_world, which is not
# installable on Python 3.14. aitk_files/ moves into src/ui_kobe/adapters in the follow-up to #19.
include = ["src", "tests"]

[tool.ty.rules]
# Stricter tier from ty's migration guide plus missing-override-decorator; all
# default to "ignore". division-by-zero, possibly-missing-attribute and
# possibly-missing-import stay off: the guide calls them false-positive-prone.
blanket-ignore-comment = "error"
dynamic-function-decorator-return = "error"
missing-override-decorator = "error"
missing-type-argument = "error"
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"
possibly-unresolved-reference = "warn"
unsupported-dynamic-base = "warn"

[tool.ty.analysis]
# `# ty: ignore[rule]  # reason` is the only suppression that works.
respect-type-ignore-comments = false
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.terminal]
# Default, stated on purpose: the two "warn" rules above are blocking too.
error-on-warning = true

# pytest, native TOML table (pytest >= 9.0). Test rules: see AGENTS.md.
[tool.pytest]
minversion = "9.0"
# Turns on strict_config, strict_markers, strict_parametrization_ids, strict_xfail.
strict = true
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
# Every warning is an error; a third-party ignore goes after "error", with a reason.
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["ui_kobe"]

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
# Ratchet: set from the measured baseline, only ever raised. See AGENTS.md.
fail_under = 53

# mutmut mutation testing, run only by `poe mutate` and .github/workflows/mutation.yml.
# Never part of `poe check`; surviving mutants are a review queue. See AGENTS.md.
[tool.mutmut]
# Mutate only the package; scripts/, aitk_files/ and aw_files/ are copy-in adapters (see AGENTS.md).
source_paths = ["src/ui_kobe/"]
# Test selection passed to pytest inside mutants/ (mutmut copies tests/ and pyproject.toml there itself).
pytest_add_cli_args_test_selection = ["tests/"]
# --no-cov: coverage is enabled only by the _test task's --cov flag, never in addopts; this guards
# mutmut's own pytest.main() run against a future move of --cov into addopts, where
# [tool.coverage.report] fail_under would abort the clean stats run.
pytest_add_cli_args = ["--no-cov"]

# Poe the Poet task runner, invoked as `uv run --locked poe <task>`. Task
# conventions, the canonical order and the insertion rule: see AGENTS.md.
[tool.poe]
executor = "simple"

[tool.poe.tasks]
_fix-lint = "ruff check --fix --exit-zero ."
_format = "ruff format ."
_format-check = "ruff format --check ."
_lint = "ruff check ."
_typecheck = "ty check"
_dependencies = "deptry ."
_environment = "uv pip check"
_test = "pytest --cov=ui_kobe --cov-report=term-missing"
_actions = "zizmor --offline ."
_build = "uv build --no-sources"
_dead-code = "vulture src tests vulture_allowlist.py --min-confidence 90"

[tool.poe.tasks.fix]
help = "Apply safe autofixes and format"
sequence = ["_fix-lint", "_format"]

[tool.poe.tasks.check-fast]
help = "Fast checks: format, lint, types"
sequence = ["_format-check", "_lint", "_typecheck"]

[tool.poe.tasks.test-unit]
help = "Run the test suite without coverage"
cmd = "pytest"

[tool.poe.tasks.check]
help = "Definition of done: every non-mutating check"
sequence = ["check-fast", "_dependencies", "_environment", "_dead-code", "_test", "_actions", "_build"]

[tool.poe.tasks.dead-code-review]
help = "Review queue: likely-dead code at 60% confidence, sorted by size, smallest first (largest last). Never deleted automatically; see AGENTS.md."
cmd = "vulture src tests vulture_allowlist.py --min-confidence 60 --sort-by-size"

[tool.poe.tasks.mutate]
help = "Mutation testing of src/ui_kobe with tests/ (review queue, never a gate); state in mutants/"
cmd = "mutmut run"
# Deterministic Hypothesis profile (derandomize, no deadline) so a slow mutant run never
# produces a spurious DeadlineExceeded kill; tests/conftest.py honours HYPOTHESIS_PROFILE.
env = { HYPOTHESIS_PROFILE = "ci" }
