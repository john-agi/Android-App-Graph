[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ui-kobe"
dynamic = ["version"]
description = "UI-KOBE: Knowledge Ontology Builder and Explorer for mobile GUI Agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = [
    "networkx",
    "openai",
    "pyyaml",
    "pillow",
    "rich",
    "dill",
    "aitk",
    "pyvis>=0.3.2",
    "matplotlib",
]
authors = [
    { name = "Yuxiang Chai" },
]

[project.scripts]
kobe-explore = "ui_kobe.cli:main"

[project.optional-dependencies]
explore = []

[project.urls]
Homepage = "https://github.com/john-agi/Android-App-Graph"

[tool.uv]
required-version = ">=0.12.9,<0.13"

[tool.uv.sources]
aitk = { git = "https://github.com/YuxiangChai/AITK", rev = "fd06a28e2286cbc1ae699401c1a6f894ba926c44" }

[tool.hatch.version]
path = "ui_kobe/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["ui_kobe"]

[tool.hatch.build.targets.sdist]
include = [
    "/ui_kobe",
    "/aitk_files",
    "/aw_files",
    "/configs",
    "/scripts",
    "/README.md",
    "/LICENSE",
]
