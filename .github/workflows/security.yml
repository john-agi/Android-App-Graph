# Deliberately outside `poe check` and not a required status check: it needs
# network access to OSV, its result changes as advisories are published, and a
# path-filtered required check would block every PR that does not touch
# dependencies.
#
# `uv audit` and the malware check (UV_MALWARE_CHECK=1) are uv preview
# features (https://docs.astral.sh/uv/concepts/preview/), exempt from uv's
# stability promise, so a patch release inside the required-version range can
# change them. A green run proves the malware check ran only if the sync step's
# log contains "Malware checks are experimental"; the "experimental" warnings
# both steps print are expected.
# The checkout, setup-uv and Python steps are byte-for-byte copies of ci.yml.
name: Security

on:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/security.yml
  schedule:
    # Daily at 06:17 UTC. Off the top of the hour because runs queued at
    # :00 are delayed. Runs against the latest commit on main and is
    # auto-disabled after 60 days without repository activity.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout only; nothing is written and no secrets are used
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ">=0.12.9,<0.13"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync the locked environment with the OSV malware check
        env:
          UV_MALWARE_CHECK: "1"
        run: uv sync --locked

      - name: Audit locked dependencies for vulnerabilities and adverse statuses
        run: uv audit
