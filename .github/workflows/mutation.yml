# Scheduled because it is slow and its output needs human judgement, so it
# gates nothing. Checkout, setup-uv and Python are byte-for-byte copies of ci.yml.
name: Mutation

on:
  schedule:
    # Off the top of the hour: runs queued at :00 are delayed.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read # checkout only; nothing is written and no secrets are used
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ">=0.12.9,<0.13"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync the locked environment with the mutation group
        run: uv sync --locked --group mutation

      - name: Run mutation testing
        run: uv run --locked --group mutation poe mutate

      - name: Report mutation counts and surviving mutants
        # `mutmut results` is undocumented; if a release drops it, delete the
        # last two lines and keep the JSON.
        run: |
          uv run --locked --group mutation mutmut export-cicd-stats
          cat mutants/mutmut-cicd-stats.json
          uv run --locked --group mutation mutmut results > mutants/mutmut-results.txt
          grep -E ': (survived|timeout|suspicious)$' mutants/mutmut-results.txt || echo "No surviving mutants"

      - name: Upload mutation results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutmut-results
          path: |
            mutants/mutmut-cicd-stats.json
            mutants/mutmut-results.txt
          if-no-files-found: error
          retention-days: 30
