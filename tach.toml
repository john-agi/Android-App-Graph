# Hand-maintained: regenerating it from the code (`tach sync`) would make `tach check` vacuous.
source_roots = ["src"]
exact = true
forbid_circular_dependencies = true
ignore_type_checking_imports = true
root_module = "forbid"

[rules]
unused_ignore_directives = "error"
require_ignore_directive_reasons = "error"

[[modules]]
path = "android_app_graph"
depends_on = ["android_app_graph.kobe"]

[[modules]]
path = "android_app_graph.commands"
depends_on = [
    "android_app_graph.device",
    "android_app_graph.graph_files",
    "android_app_graph.member_groups",
    "android_app_graph.payloads",
    "android_app_graph.screen_image",
    "android_app_graph.step_log",
    "android_app_graph.utils",
    "android_app_graph.utils.graph_manager",
    "android_app_graph.utils.logging",
    "android_app_graph.utils.vlm_utils",
]

[[modules]]
path = "android_app_graph.graph_files"
depends_on = ["android_app_graph.payloads"]

[[modules]]
path = "android_app_graph.member_groups"
depends_on = []

[[modules]]
path = "android_app_graph.checkpoint"
depends_on = []

[[modules]]
path = "android_app_graph.merge_rounds"
depends_on = []

[[modules]]
path = "android_app_graph.screen_image"
depends_on = []

[[modules]]
path = "android_app_graph.step_log"
depends_on = [
    "android_app_graph.device",
    "android_app_graph.graph_files",
    "android_app_graph.payloads",
    "android_app_graph.screen_image",
]

[[modules]]
path = "android_app_graph.cli"
depends_on = [
    "android_app_graph.device",
    "android_app_graph.kobe",
    "android_app_graph.utils",
    "android_app_graph.utils.logging",
]

[[modules]]
path = "android_app_graph.kobe"
depends_on = [
    "android_app_graph.device",
    "android_app_graph.graph_files",
    "android_app_graph.step_log",
    "android_app_graph.utils",
    "android_app_graph.utils.graph_manager",
    "android_app_graph.utils.vlm_utils",
]

[[modules]]
path = "android_app_graph.utils"
depends_on = ["android_app_graph.payloads", "android_app_graph.retrying"]

[[modules]]
path = "android_app_graph.utils.graph_manager"
depends_on = [
    "android_app_graph.checkpoint",
    "android_app_graph.graph_files",
    "android_app_graph.member_groups",
    "android_app_graph.merge_rounds",
    "android_app_graph.payloads",
    "android_app_graph.step_log",
    "android_app_graph.utils",
    "android_app_graph.utils.vlm_utils",
]

[[modules]]
path = "android_app_graph.utils.vlm_utils"
depends_on = [
    "android_app_graph.checkpoint",
    "android_app_graph.payloads",
    "android_app_graph.retrying",
    "android_app_graph.screen_image",
    "android_app_graph.utils",
]

[[modules]]
path = "android_app_graph.utils.logging"
depends_on = []

[[modules]]
path = "android_app_graph.device"
depends_on = ["android_app_graph.payloads"]

[[modules]]
path = "android_app_graph.payloads"
depends_on = []

[[modules]]
path = "android_app_graph.retrying"
depends_on = []
